<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoramento - Assinaturas</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #f59e0b;
      --red: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      padding: 20px 24px; background: #0b3a6e; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header .user { font-size: 13px; opacity: 0.9; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select, button {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      font-size: 14px; background: #fff; color: var(--text);
    }
    button { cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--blue); color: #fff; border: none; }
    .btn-outline { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    .actions { display: flex; gap: 12px; align-items: flex-end; }
    .status { margin-top: 12px; font-size: 13px; color: var(--muted); }
    .error { color: var(--red); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-block; }
    .pill.trialing { background: #fff7ed; color: #c2410c; }
    .pill.active { background: #ecfdf3; color: #15803d; }
    .pill.expired { background: #fef2f2; color: #b91c1c; }
    .pill.other { background: #f1f5f9; color: #0f172a; }
    .muted { color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Monitoramento de Assinaturas</h1>
    <div class="user" id="user-info">Desconectado</div>
  </header>

  <main>
    <div class="card" id="login-card">
      <div class="row">
        <div>
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" placeholder="seu@email.com" />
        </div>
        <div>
          <label for="login-pass">Senha</label>
          <input id="login-pass" type="password" placeholder="••••••••" />
        </div>
        <div class="actions">
          <button class="btn-primary" id="btn-login">Entrar</button>
          <button class="btn-outline" id="btn-logout" type="button">Sair</button>
        </div>
      </div>
      <div class="status" id="login-status"></div>
    </div>

    <div class="card" style="margin-top:16px;" id="panel-card">
      <div class="row">
        <div>
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="trialing">Trialing</option>
            <option value="active">Active</option>
            <option value="expired">Expirado</option>
            <option value="other">Outros</option>
          </select>
        </div>
        <div>
          <label for="filter-search">Buscar (empresa/email/id)</label>
          <input id="filter-search" type="text" placeholder="Ex: cabalo, @gmail, empresaId" />
        </div>
        <div class="actions">
          <button class="btn-primary" id="btn-refresh">Atualizar</button>
        </div>
      </div>
      <div class="status" id="panel-status"></div>
      <div class="status" id="panel-error"></div>

      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Empresa</th>
              <th>Empresa ID</th>
              <th>Email</th>
              <th>Status</th>
              <th>Plano</th>
              <th>Dias Restantes</th>
              <th>Trial Fim</th>
              <th>Atualizado</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
  <script src="/firebase-global.js?v=4.1.3"></script>
  <script src="/monitoramento.js?v=1.0.4"></script>
</body>
</html>
