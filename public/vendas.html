<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- META ANTI-CACHE (IMPORTANTE) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendas - Meu Manager</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="meumanager-logo-completo.png" />
  <link rel="shortcut icon" type="image/png" href="meumanager-logo-completo.png" />

  <link rel="stylesheet" href="/style.css?v=4.1.11" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body data-page="vendas">
  <!-- ================= LAYOUT: Header e Sidebar Componentizados ================= -->
  <div id="header-container"></div>
  <div id="sidebar-container"></div>

  <!-- ================= MAIN ================= -->
  <main class="dashboard">

    <div class="dashboard-top">
      <button class="menu-toggle" type="button" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1><i class="fa-solid fa-receipt"></i> Vendas</h1>
    </div>

    <!-- ================= TOOLBAR COM FILTROS ================= -->
    <div class="toolbar-produtos">

      <div class="toolbar-left">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="venda-busca" type="text" placeholder="Buscar SKU, produto, canal, pedido..." />
        </div>

        <button id="abrir-modal-venda" class="btn btn-primary" type="button">
          <i class="fa-solid fa-plus"></i> Registrar Venda
        </button>

        <button id="btn-limpar-filtros" class="btn btn-outline" type="button" title="Limpar filtros">
          <i class="fa-solid fa-filter-circle-xmark"></i> Limpar
        </button>
      </div>

      <div class="toolbar-right">
        <div class="filter-group">
          <select id="filtro-canal" class="filter-select">
            <option value="">Todos Canais</option>
            <option value="ML">ML</option>
            <option value="Shopee">Shopee</option>
            <option value="Facebook">Facebook</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Loja Integrada">Loja Integrada</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="filtro-status" class="filter-select">
            <option value="">Todos Status</option>
            <option value="AGUARD">Aguardando</option>
            <option value="TRANSP">Em Transporte</option>
            <option value="CONCL">Conclu&iacute;do</option>
            <option value="CANCEL">Cancelado</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="filtro-periodo" class="filter-select">
            <option value="">Todo Per&iacute;odo</option>
            <option value="hoje">Hoje</option>
            <option value="7d">&Uacute;ltimos 7 dias</option>
            <option value="30d">&Uacute;ltimos 30 dias</option>
            <option value="mes">Este m&ecirc;s</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="filtro-lucro" class="filter-select">
            <option value="">Todo Lucro</option>
            <option value="positivo">Lucro positivo</option>
            <option value="negativo">Lucro negativo</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Contador e Totais -->
    <div class="vendas-resumo">
      <span id="contador-vendas" class="contador-resultados"></span>
      <div class="vendas-totais">
        <span class="total-item">Total: <strong id="total-vendas">R$ 0,00</strong></span>
        <span class="total-item">Lucro: <strong id="total-lucro">R$ 0,00</strong></span>
      </div>
    </div>

    <!-- Tabela com scroll horizontal sempre visivel (Vendas) -->
 <section class="card forn-section vendas-table-card">
  <div class="table-scroll-container vendas-scroll">
    <div class="table-wrapper vendas-wrapper" id="vendas-table-wrapper">
      <table class="forn-table vendas-table" id="vendas-table">
        <thead>
          <tr>
            <th class="center" style="width:50px;">ID</th>
            <th class="center" style="width:90px;">Data</th>
            <th style="width:100px;">SKU</th>
            <th style="width:180px;">Produto</th>
            <th class="center" style="width:50px;">Qtd</th>
            <th style="width:70px;">Canal</th>
            <th style="width:130px;">N&ordm; Pedido</th>
            <th class="right" style="width:90px;">Valor Uni</th>
            <th class="right" style="width:90px;">Custo Uni</th>
            <th class="right" style="width:90px;">Valor Tot</th>
            <th class="center" style="width:70px;">Com. %</th>
            <th class="right" style="width:90px;">Com. R$</th>
            <th class="right" style="width:80px;">Frete</th>
            <th class="right" style="width:90px;">Saldo ML</th>
            <th class="right" style="width:80px;">CMV</th>
            <th class="right" style="width:80px;">Outros</th>
            <th class="right" style="width:90px;">Lucro</th>
            <th style="width:100px;">Obs</th>
            <th class="center" style="width:90px;">Status</th>
            <th class="center" style="width:80px;">A&ccedil;&otilde;es</th>
          </tr>
        </thead>
        <tbody id="tabela-vendas-body"></tbody>
      </table>
    </div>

    <!-- Barra horizontal fixa (sempre aparece) -->
    <div class="vendas-xbar" id="vendas-xbar" aria-hidden="true">
      <div class="vendas-xbar-inner" id="vendas-xbar-inner"></div>
    </div>
  </div>
</section>


  </main>

  <!-- ========== SCRIPTS ========== -->
  <script src="/header-manager.js?v=4.1.15"></script>

  <!-- Firebase Compat Global -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="/firebase-global.js?v=4.1.3"></script>
  <script src="/firebase-sync.js?v=4.1.3"></script>
  <script src="/script.js?v=4.1.15"></script>
  <script src="/vendas.js?v=4.1.14"></script>

  <!-- ========== LAYOUT MODULAR ========== -->
  <script type="module">
    import { initializeLayout } from "/components/layout.js?v=4.1.3";
    initializeLayout();
  </script>
</body>
</html>
